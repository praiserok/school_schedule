<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Розклад</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-sm" style="width:100%;max-width:360px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-calendar3 fs-1 text-primary"></i>
        <h5 class="mt-2 mb-0">Розклад занять</h5>
        <div class="text-muted small">Адміністративний доступ</div>
      </div>
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">Невірний логін або пароль.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Логін</label>
          <input type="text" name="username" class="form-control" autofocus autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Пароль</label>
          <input type="password" name="password" class="form-control" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Увійти
        </button>
      </form>
    </div>
  </div>
</body>
</html>
